name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests and repo checks
        run: npm run check

      - name: Smoke test the running app
        run: npm run smoke

      - name: Build Docker image
        run: docker compose build

      - name: Start container and check endpoints
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz | grep -q '"ok":true'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz | grep -q '"ok":true'
          curl -fsS http://localhost:3000/ | grep -q "Care Taker"

      - name: Stop container
        if: always()
        run: docker compose down -v
