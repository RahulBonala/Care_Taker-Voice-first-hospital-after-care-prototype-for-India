<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" width="1440" height="360" role="img" aria-labelledby="footer-loop-title footer-loop-desc">
  <title id="footer-loop-title">Care Taker</title>
  <desc id="footer-loop-desc">Animated Care Taker closing loop from spoken dose confirmation to Checked in.</desc>

  <defs>
    <pattern id="footer-grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="0.7" fill="#1B1F24" />
      <circle cx="16" cy="11" r="0.6" fill="#1B1F24" />
      <circle cx="9" cy="20" r="0.7" fill="#1B1F24" />
      <circle cx="21" cy="18" r="0.5" fill="#1B1F24" />
    </pattern>

    <!-- Straight horizontal text paths strictly outside the loop (x=255..385) -->
    <path id="straight-path-left" d="M 18 198 L 244 198" />
    <path id="straight-path-mid" d="M 404 198 L 748 198" />

    <!-- Clip windows ensuring drifting text stays strictly on the straight line segments and never touches the loop crossing -->
    <clipPath id="clip-straight-left">
      <rect x="14" y="162" width="232" height="44" />
    </clipPath>
    <clipPath id="clip-straight-mid">
      <rect x="402" y="162" width="348" height="44" />
    </clipPath>
  </defs>

  <style>
    .spoken-text {
      font-family: "Noto Sans", "Noto Sans Telugu", sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #1B1F24;
      opacity: 0.78;
    }
    .drift-left {
      animation: flowTextLeft 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }
    .drift-mid {
      animation: flowTextMid 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    /* Wordmark letters: C a r e   T a k e r */
    .wm-letter {
      font-family: "Noto Sans", "Noto Sans Telugu", sans-serif;
      font-size: 56px;
      font-weight: 700;
      fill: #1B1F24;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    .wm-c1 { animation: letterUnravel1 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-a1 { animation: letterUnravel2 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-r1 { animation: letterUnravel3 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-e1 { animation: letterUnravel4 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-t2 { animation: letterUnravel5 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-a2 { animation: letterUnravel6 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-k2 { animation: letterUnravel7 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-e2 { animation: letterUnravel8 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .wm-r2 { animation: letterUnravel9 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }

    /* Unraveling horizontal strokes that slide left to join the line to the left of the phone */
    .unravel-seg {
      stroke: #0F5C5A;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0;
    }
    .seg-9 { animation: segSlide9 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-8 { animation: segSlide8 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-7 { animation: segSlide7 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-6 { animation: segSlide6 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-5 { animation: segSlide5 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-4 { animation: segSlide4 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-3 { animation: segSlide3 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-2 { animation: segSlide2 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .seg-1 { animation: segSlide1 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }

    /* Joined line build-up and bright Teal segment running into the phone (5.4s to 6.2s) */
    .teal-runner {
      fill: none;
      stroke: #0F5C5A;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 28 100;
      stroke-dashoffset: 128;
      opacity: 0;
      animation: runIntoPhone 9.6s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    /* Phone screen heart and green tick */
    .phone-heart {
      transform-origin: 16px 15.8px;
      animation: heartBeatCycle 9.6s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }
    .phone-tick {
      fill: none;
      stroke: #1E7B4F;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      opacity: 0;
      animation: phoneTickCycle 9.6s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }

    /* Checked in lockup (7.4s to 8.8s wipe in, 8.8s to 9.6s fade out) */
    .checked-in-group {
      opacity: 0;
      animation: checkedInWipe 9.6s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }
    .checked-in-tick {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: checkedInTickDraw 9.6s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }

    /* 0.0 to 4.0s (0% to 41.67%): Text flows slowly along the straight line segments */
    @keyframes flowTextLeft {
      0% { transform: translateX(-14px); opacity: 0.78; }
      41.67% { transform: translateX(14px); opacity: 0.78; }
      54%, 88% { transform: translateX(18px); opacity: 0.25; }
      100% { transform: translateX(-14px); opacity: 0.78; }
    }
    @keyframes flowTextMid {
      0% { transform: translateX(-22px); opacity: 0.78; }
      41.67% { transform: translateX(26px); opacity: 0.78; }
      54%, 88% { transform: translateX(32px); opacity: 0.25; }
      100% { transform: translateX(-22px); opacity: 0.78; }
    }

    /* 4.0 to 5.4s (41.67% to 56.25%): Letters unravel from last ('r') to first ('C'), return at 91.67%..100% */
    @keyframes letterUnravel9 {
      0%, 41.67% { opacity: 1; transform: scaleY(1); }
      43.5%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel8 {
      0%, 43.0% { opacity: 1; transform: scaleY(1); }
      45.0%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel7 {
      0%, 44.4% { opacity: 1; transform: scaleY(1); }
      46.4%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel6 {
      0%, 45.8% { opacity: 1; transform: scaleY(1); }
      47.8%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel5 {
      0%, 47.2% { opacity: 1; transform: scaleY(1); }
      49.2%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel4 {
      0%, 48.6% { opacity: 1; transform: scaleY(1); }
      50.6%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel3 {
      0%, 50.0% { opacity: 1; transform: scaleY(1); }
      52.0%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel2 {
      0%, 51.4% { opacity: 1; transform: scaleY(1); }
      53.4%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes letterUnravel1 {
      0%, 52.8% { opacity: 1; transform: scaleY(1); }
      55.0%, 91.67% { opacity: 0; transform: scaleY(0.08); }
      98%, 100% { opacity: 1; transform: scaleY(1); }
    }

    /* Unraveled horizontal strokes slide left to join the line end-to-end on the left of the phone */
    @keyframes segSlide9 {
      0%, 41.67% { opacity: 0; transform: translateX(0px); }
      42.5% { opacity: 1; transform: translateX(0px); }
      48.0%, 56.25% { opacity: 1; transform: translateX(-380px); }
      60%, 100% { opacity: 0; transform: translateX(-380px); }
    }
    @keyframes segSlide8 {
      0%, 43.0% { opacity: 0; transform: translateX(0px); }
      43.8% { opacity: 1; transform: translateX(0px); }
      49.0%, 56.25% { opacity: 1; transform: translateX(-380px); }
      60%, 100% { opacity: 0; transform: translateX(-380px); }
    }
    @keyframes segSlide7 {
      0%, 44.4% { opacity: 0; transform: translateX(0px); }
      45.2% { opacity: 1; transform: translateX(0px); }
      50.0%, 56.25% { opacity: 1; transform: translateX(-380px); }
      60%, 100% { opacity: 0; transform: translateX(-380px); }
    }
    @keyframes segSlide6 {
      0%, 45.8% { opacity: 0; transform: translateX(0px); }
      46.6% { opacity: 1; transform: translateX(0px); }
      51.0%, 56.25% { opacity: 1; transform: translateX(-380px); }
      60%, 100% { opacity: 0; transform: translateX(-380px); }
    }
    @keyframes segSlide5 {
      0%, 47.2% { opacity: 0; transform: translateX(0px); }
      48.0% { opacity: 1; transform: translateX(0px); }
      52.0%, 56.25% { opacity: 1; transform: translateX(-380px); }
      60%, 100% { opacity: 0; transform: translateX(-380px); }
    }
    @keyframes segSlide4 {
      0%, 48.6% { opacity: 0; transform: translateX(0px); }
      49.4% { opacity: 1; transform: translateX(0px); }
      53.2%, 56.25% { opacity: 1; transform: translateX(-370px); }
      60%, 100% { opacity: 0; transform: translateX(-370px); }
    }
    @keyframes segSlide3 {
      0%, 50.0% { opacity: 0; transform: translateX(0px); }
      50.8% { opacity: 1; transform: translateX(0px); }
      54.2%, 56.25% { opacity: 1; transform: translateX(-370px); }
      60%, 100% { opacity: 0; transform: translateX(-370px); }
    }
    @keyframes segSlide2 {
      0%, 51.4% { opacity: 0; transform: translateX(0px); }
      52.2% { opacity: 1; transform: translateX(0px); }
      55.2%, 56.25% { opacity: 1; transform: translateX(-370px); }
      60%, 100% { opacity: 0; transform: translateX(-370px); }
    }
    @keyframes segSlide1 {
      0%, 52.8% { opacity: 0; transform: translateX(0px); }
      53.6% { opacity: 1; transform: translateX(0px); }
      56.25% { opacity: 1; transform: translateX(-370px); }
      60%, 100% { opacity: 0; transform: translateX(-370px); }
    }

    /* 5.4 to 6.2s (56.25% to 64.58%): Bright Teal segment runs along the line into the phone */
    @keyframes runIntoPhone {
      0%, 55.5% { opacity: 0; stroke-dashoffset: 128; }
      56.25% { opacity: 1; stroke-dashoffset: 100; }
      64.58% { opacity: 1; stroke-dashoffset: 0; }
      66.5%, 100% { opacity: 0; stroke-dashoffset: -28; }
    }

    /* 6.2 to 6.8s (64.58% to 70.83%): Heart steps back, green tick draws in.
       6.8 to 7.4s (70.83% to 77.08%): Tick becomes heart again with one soft beat. */
    @keyframes heartBeatCycle {
      0%, 63.5% { opacity: 1; transform: scale(1); }
      64.58%, 70.83% { opacity: 0; transform: scale(0.72); }
      72.5% { opacity: 1; transform: scale(1.18); }
      75.0% { opacity: 1; transform: scale(0.95); }
      77.08%, 100% { opacity: 1; transform: scale(1); }
    }

    @keyframes phoneTickCycle {
      0%, 64.0% { opacity: 0; stroke-dashoffset: 100; }
      64.58% { opacity: 1; stroke-dashoffset: 100; }
      68.5%, 70.83% { opacity: 1; stroke-dashoffset: 0; }
      72.2%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }

    /* 7.4 to 8.8s (77.08% to 91.67%): "Checked in" with green tick wipes in where "Care Taker" was.
       8.8 to 9.6s (91.67% to 100%): Fades back to "Care Taker". */
    @keyframes checkedInWipe {
      0%, 76.5% { opacity: 0; transform: translateX(-14px); }
      79.5%, 91.67% { opacity: 1; transform: translateX(0px); }
      97.5%, 100% { opacity: 0; transform: translateX(8px); }
    }
    @keyframes checkedInTickDraw {
      0%, 77.08% { stroke-dashoffset: 100; }
      81.5%, 91.67% { stroke-dashoffset: 0; }
      98%, 100% { stroke-dashoffset: 100; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
      .unravel-seg,
      .teal-runner,
      .phone-tick,
      .checked-in-group,
      .spoken-text-group {
        display: none !important;
        opacity: 0 !important;
      }
      .wm-letter,
      .phone-heart {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <!-- Continuous thin Ink line from far left edge (0,210), through one loose vertical loop, through the phone at 55% width (x=792), to the far right edge (1440,210) without a break -->
  <path
    id="continuous-thread-line"
    d="M 0 210 L 260 210 C 345 210, 385 180, 385 130 C 385 78, 350 52, 320 52 C 290 52, 255 78, 255 130 C 255 180, 295 210, 380 210 L 792 210 L 1440 210"
    fill="none"
    stroke="#1B1F24"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Spoken dose confirmation text riding strictly on the straight horizontal segments (never on the loop crossing x=255..385) -->
  <g class="spoken-text-group">
    <g clip-path="url(#clip-straight-left)">
      <g class="drift-left">
        <text class="spoken-text">
          <textPath href="#straight-path-left" startOffset="4%">నేను 1 గంటకు మాత్ర వేసుకున్నాను</textPath>
        </text>
      </g>
    </g>

    <g clip-path="url(#clip-straight-mid)">
      <g class="drift-mid">
        <text class="spoken-text">
          <textPath href="#straight-path-mid" startOffset="12%">I took my tablet at 1:00 pm</textPath>
        </text>
      </g>
    </g>
  </g>

  <!-- Unraveling horizontal strokes that detach from "Care Taker" letters and slide left onto the line (y=210) -->
  <g id="unraveling-letter-strokes" aria-hidden="true">
    <line class="unravel-seg seg-1" x1="842" y1="210" x2="876" y2="210" />
    <line class="unravel-seg seg-2" x1="880" y1="210" x2="910" y2="210" />
    <line class="unravel-seg seg-3" x1="914" y1="210" x2="936" y2="210" />
    <line class="unravel-seg seg-4" x1="940" y1="210" x2="970" y2="210" />
    <line class="unravel-seg seg-5" x1="990" y1="210" x2="1022" y2="210" />
    <line class="unravel-seg seg-6" x1="1026" y1="210" x2="1056" y2="210" />
    <line class="unravel-seg seg-7" x1="1060" y1="210" x2="1090" y2="210" />
    <line class="unravel-seg seg-8" x1="1094" y1="210" x2="1124" y2="210" />
    <line class="unravel-seg seg-9" x1="1128" y1="210" x2="1150" y2="210" />
  </g>

  <!-- Bright Teal segment running along the line into the phone (5.4s to 6.2s) -->
  <path
    class="teal-runner"
    pathLength="100"
    d="M 410 210 L 792 210"
  />

  <!-- Phone icon centred at 55% width (x = 792, y = 210) -->
  <g id="phone-mark" transform="translate(736, 154) scale(3.5)">
    <!-- Rounded rectangle in Teal (#0F5C5A) with Paper/White interior so the continuous line passes cleanly behind -->
    <rect x="8.5" y="3" width="15" height="26" rx="3.6" fill="#F7F5F0" stroke="#0F5C5A" stroke-width="2.2" />
    <!-- Care Taker heart on screen -->
    <path class="phone-heart" d="M16 19.6l-3.7-3.5a2.4 2.4 0 0 1 3.3-3.4l.4.4.4-.4a2.4 2.4 0 0 1 3.3 3.4z" fill="#0F5C5A" />
    <!-- Green ok (#1E7B4F) tick stroke on screen -->
    <path class="phone-tick" pathLength="100" d="M 12.3 15.8 L 15.0 18.5 L 20.0 13.0" />
    <!-- Bottom slot -->
    <path d="M14 25.3h4" fill="none" stroke="#0F5C5A" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Wordmark "Care Taker" to the right of the phone in Ink (#1B1F24), bold -->
  <g id="wordmark-care-taker" aria-label="Care Taker">
    <text class="wm-letter wm-c1" x="842" y="229">C</text>
    <text class="wm-letter wm-a1" x="881" y="229">a</text>
    <text class="wm-letter wm-r1" x="914" y="229">r</text>
    <text class="wm-letter wm-e1" x="938" y="229">e</text>
    <text class="wm-letter wm-t2" x="988" y="229">T</text>
    <text class="wm-letter wm-a2" x="1021" y="229">a</text>
    <text class="wm-letter wm-k2" x="1054" y="229">k</text>
    <text class="wm-letter wm-e2" x="1087" y="229">e</text>
    <text class="wm-letter wm-r2" x="1120" y="229">r</text>
  </g>

  <!-- "Checked in" with small green tick wiping in where "Care Taker" was (7.4s to 8.8s) -->
  <g class="checked-in-group" aria-label="Checked in">
    <g transform="translate(844, 192)" fill="none" stroke="#1E7B4F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="15" fill="#E3F0EE" />
      <path class="checked-in-tick" pathLength="100" d="M 11.5 18.5 L 16.0 23.0 L 25.0 13.5" />
    </g>
    <text
      x="892"
      y="229"
      font-family="Noto Sans, Noto Sans Telugu, sans-serif"
      font-size="54"
      font-weight="700"
      fill="#1B1F24"
    >Checked in</text>
  </g>

  <!-- Subtle paper grain overlay at 0.05 opacity -->
  <rect x="0" y="40" width="1440" height="240" fill="url(#footer-grain)" opacity="0.05" pointer-events="none" />
</svg>
